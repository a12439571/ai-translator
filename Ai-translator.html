<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Translator</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --pri:#7c8cff;--pri2:#a78bfa;
      --bg:#0f1117;--card:#1a1d2e;--card2:#141726;
      --border:#2d3152;--border2:#252844;
      --text:#dde1f5;--muted:#525a80;--light:#8890b8;
      --inp:#12151f;
      --orig-bg:#1a1e35;--orig-bd:#252a48;
      --trans-bg:#1a2245;--trans-bd:#2a3560;
      --r:10px;--sh:0 2px 12px rgba(0,0,0,.4);
    }
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

    /* Toast */
    #toast{
      position:fixed;top:64px;left:50%;transform:translateX(-50%);
      padding:10px 20px;border-radius:8px;font-size:.9rem;font-weight:500;
      z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;
      max-width:90vw;text-align:center;white-space:pre-line;
    }
    #toast.err{background:#7f1d1d;color:#fca5a5;border:1px solid #991b1b}
    #toast.ok {background:#14532d;color:#86efac;border:1px solid #166534}
    #toast.inf{background:#1e3a5f;color:#93c5fd;border:1px solid #1d4ed8}
    #toast.on {opacity:1}

    /* Header */
    .hd{
      background:linear-gradient(135deg,#3d3f8f,#5b4b9a);color:#fff;
      padding:13px 18px;display:flex;align-items:center;justify-content:space-between;
      position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,.5);
    }
    .hd h1{font-size:1.1rem;font-weight:700}
    #saved{font-size:.78rem;background:rgba(255,255,255,.15);padding:3px 9px;border-radius:12px;opacity:0;transition:opacity .3s}
    #saved.on{opacity:1}

    .wrap{max-width:1200px;margin:0 auto;padding:14px}

    /* Card / Accordion */
    .card{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
    .ac-hd{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;cursor:pointer;user-select:none;border:none;background:transparent;width:100%;text-align:left;color:var(--text)}
    .ac-hd:hover{background:rgba(255,255,255,.03)}
    .ac-title{font-size:.92rem;font-weight:600;color:var(--light);display:flex;align-items:center;gap:7px}
    .ac-arr{color:var(--muted);font-size:.75rem;transition:transform .25s}
    .ac-arr.open{transform:rotate(180deg)}
    .ac-body{display:none;padding:4px 18px 18px;border-top:1px solid var(--border2)}
    .ac-body.open{display:block}

    /* Provider */
    .prov-row{display:flex;gap:10px;margin:14px 0 12px}
    .prov-btn{flex:1;padding:9px 12px;border:2px solid var(--border);border-radius:8px;background:var(--inp);cursor:pointer;font-size:.87rem;font-weight:500;color:var(--light);transition:all .18s}
    .prov-btn.on{border-color:var(--pri);background:#1c1f40;color:var(--pri)}

    /* Fields */
    .frow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .flabel{font-size:.82rem;color:var(--light);white-space:nowrap;min-width:62px}
    .finput{flex:1;padding:8px 11px;border:1px solid var(--border);border-radius:7px;font-size:.88rem;font-family:inherit;outline:none;transition:border-color .2s;background:var(--inp);color:var(--text)}
    .finput:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(124,140,255,.15)}
    .finput::placeholder{color:var(--muted)}
    .key-wrap{flex:1;display:flex;gap:6px}
    .key-wrap .finput{flex:1}
    .icon-btn{padding:8px 11px;border:1px solid var(--border);border-radius:7px;background:var(--inp);cursor:pointer;font-size:.85rem;color:var(--light)}
    .icon-btn:hover{background:#22263a}
    .model-wrap{flex:1;display:flex;align-items:center;gap:8px}
    .model-wrap select{flex:1;padding:8px 11px;border:1px solid var(--border);border-radius:7px;font-size:.88rem;font-family:inherit;outline:none;cursor:pointer;background:var(--inp);color:var(--text)}
    .model-wrap select:focus{border-color:var(--pri)}
    .model-wrap select option{background:#1a1d2e;color:var(--text)}
    .mstatus{font-size:.77rem;color:var(--muted);white-space:nowrap;min-width:70px}

    /* Glossary */
    .gsec{margin-top:14px;padding-top:14px;border-top:1px solid var(--border2)}
    .sec-title{font-size:.88rem;font-weight:600;color:var(--light);margin-bottom:10px}
    .gblock{margin-bottom:10px}
    .glabel{display:block;font-size:.82rem;color:var(--light);margin-bottom:5px;font-weight:500}
    .ghint{font-weight:400;color:var(--muted);font-size:.78rem}
    .gtxt{
      width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;
      font-size:.85rem;font-family:inherit;resize:vertical;min-height:70px;outline:none;
      line-height:1.6;transition:border-color .2s;background:var(--inp);color:var(--text);
    }
    .gtxt:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(124,140,255,.15)}
    .gtxt::placeholder{color:var(--muted)}
    .grow{display:flex;align-items:center;gap:10px;margin-top:8px}
    #gstatus{font-size:.8rem;color:var(--muted)}
    code.fmt{background:#1e2240;padding:1px 5px;border-radius:3px;color:#a5b4fc;font-size:.78rem}

    /* Buttons */
    .btn{
      padding:8px 16px;background:linear-gradient(135deg,var(--pri),var(--pri2));
      color:#fff;border:none;border-radius:7px;cursor:pointer;font-size:.88rem;
      font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;transition:opacity .18s;
    }
    .btn:hover{opacity:.85}
    .btn:disabled{opacity:.35;cursor:not-allowed}
    .btn-ghost{
      padding:5px 10px;font-size:.8rem;background:none;
      border:1px solid var(--border);color:var(--light);border-radius:6px;cursor:pointer;transition:all .15s;
    }
    .btn-ghost:hover{border-color:#ef4444;color:#f87171;background:rgba(239,68,68,.1)}
    .btn-paste{
      padding:5px 10px;font-size:.8rem;background:none;
      border:1px solid var(--border);color:var(--light);border-radius:6px;cursor:pointer;transition:all .15s;
    }
    .btn-paste:hover{border-color:var(--pri);color:var(--pri);background:rgba(124,140,255,.1)}
    .btn-paste.pasted{border-color:#34d399;color:#34d399;background:rgba(52,211,153,.1)}

    /* Language selector */
    .lw{position:relative;margin-bottom:11px}
    .ldisplay{
      display:flex;align-items:center;justify-content:space-between;
      padding:8px 11px;border:1px solid var(--border);border-radius:7px;
      cursor:pointer;font-size:.88rem;background:var(--inp);color:var(--text);user-select:none;transition:border-color .18s;
    }
    .ldisplay:hover{border-color:var(--pri)}
    .larr{color:var(--muted);font-size:.72rem}
    .ldd{
      position:absolute;top:calc(100% + 4px);left:0;right:0;
      background:#1e2235;border:1px solid var(--border);border-radius:8px;
      box-shadow:0 8px 28px rgba(0,0,0,.5);z-index:300;display:none;overflow:hidden;
    }
    .ldd.open{display:block}
    .lsearch{width:100%;padding:9px 12px;border:none;border-bottom:1px solid var(--border2);font-size:.88rem;outline:none;font-family:inherit;background:#1a1d2e;color:var(--text)}
    .lsearch::placeholder{color:var(--muted)}
    .lopts{max-height:210px;overflow-y:auto}
    .lopt{padding:9px 12px;cursor:pointer;font-size:.88rem;color:var(--text)}
    .lopt:hover{background:#252a45}
    .lopt.sel{background:#1e2650;color:var(--pri);font-weight:500}

    /* Panels */
    .panels{display:flex;gap:14px;align-items:flex-start}
    .panel{flex:1;background:var(--card);border:1px solid var(--border2);border-radius:var(--r);box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column}
    .ptitle{font-size:.88rem;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px}
    .pl .ptitle{color:#9da8ff}
    .pr .ptitle{color:#c4b5fd}
    .ctx-badge{margin-left:auto;font-size:.72rem;font-weight:500;color:#818cf8;background:#1e2240;padding:2px 7px;border-radius:10px;border:1px solid #2d3360}

    /* Input area */
    .input-wrap{position:relative;margin-bottom:0}
    textarea.ti{
      width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:7px;
      font-size:.9rem;font-family:inherit;resize:vertical;min-height:100px;
      outline:none;line-height:1.55;transition:border-color .2s;
      background:var(--inp);color:var(--text);
    }
    textarea.ti:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(124,140,255,.15)}
    textarea.ti::placeholder{color:var(--muted)}

    .tact{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:9px 0}
    .tact-l{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
    .hint{font-size:.73rem;color:var(--muted)}

    /* History */
    .histbox{
      border:1px solid var(--border2);border-radius:8px;
      max-height:360px;overflow-y:auto;background:var(--card2);
      padding:10px 11px;display:flex;flex-direction:column;gap:10px;
    }
    .histbox:empty::before{
      content:'Translation history will appear here. AI uses the full conversation as context.';
      display:block;color:var(--muted);font-style:italic;font-size:.84rem;text-align:center;padding:18px 0;
    }
    .hentry{display:flex;flex-direction:column;gap:5px}
    .hentry-orig{
      font-size:.8rem;color:var(--light);background:var(--orig-bg);border:1px solid var(--orig-bd);border-radius:6px;
      padding:6px 9px;line-height:1.5;word-break:break-word;white-space:pre-wrap;
    }
    .orig-label{font-size:.72rem;font-weight:600;color:var(--muted);display:block;margin-bottom:2px}
    .hentry-trans{
      position:relative;background:var(--trans-bg);border:1px solid var(--trans-bd);border-radius:7px;
      padding:9px 50px 9px 11px;font-size:.9rem;line-height:1.6;
      word-break:break-word;white-space:pre-wrap;color:#c7d2fe;
    }
    .trans-label{font-size:.72rem;font-weight:600;color:#6366f1;display:block;margin-bottom:3px}
    .cpbtn{
      position:absolute;top:7px;right:7px;padding:3px 9px;background:#1e2240;
      border:1px solid #3d4470;border-radius:5px;cursor:pointer;font-size:.75rem;color:#818cf8;
      transition:all .15s;white-space:nowrap;
    }
    .cpbtn:hover{background:#252a50;border-color:var(--pri);color:var(--pri)}
    .cpbtn.copied{background:#14532d;border-color:#166534;color:#86efac}

    /* Scrollbar */
    .histbox::-webkit-scrollbar{width:5px}
    .histbox::-webkit-scrollbar-track{background:transparent}
    .histbox::-webkit-scrollbar-thumb{background:#2d3152;border-radius:3px}

    /* Spinner */
    .sp{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Mobile tabs */
    .mtabs{display:none}
    .tabnav{display:flex;background:#141726;border-radius:var(--r) var(--r) 0 0;overflow:hidden;border:1px solid var(--border2);border-bottom:none}
    .tabbtn{flex:1;padding:12px;border:none;background:transparent;font-size:.9rem;font-weight:500;cursor:pointer;color:var(--muted);transition:all .18s}
    .tabbtn.on{background:var(--card);color:var(--pri);border-bottom:2px solid var(--pri)}
    .tabcnt{display:none;background:var(--card);padding:16px;border-radius:0 0 var(--r) var(--r);box-shadow:var(--sh);border:1px solid var(--border2);border-top:none}
    .tabcnt.on{display:block}

    @media(max-width:700px){
      .panels{display:none}
      .mtabs{display:block}
      .frow{flex-wrap:wrap}
      .flabel{min-width:auto;width:100%}
      .key-wrap,.model-wrap{flex:none;width:100%}
    }
    @media(max-width:440px){
      .wrap{padding:10px}
      .prov-row{flex-direction:column}
    }
  </style>
</head>
<body>

<div id="toast"></div>

<!-- Header -->
<div class="hd">
  <h1>🌐 AI Translator</h1>
  <span id="saved">✓ Saved</span>
</div>

<div class="wrap">

  <!-- Settings -->
  <div class="card">
    <button class="ac-hd" onclick="toggleAc('settings')">
      <span class="ac-title">⚙️ Settings</span>
      <span class="ac-arr" id="arrSettings">▼</span>
    </button>
    <div class="ac-body" id="bodySettings">

      <div style="font-size:.8rem;color:var(--muted);margin-top:10px;margin-bottom:4px">AI Provider</div>
      <div class="prov-row">
        <button class="prov-btn" id="btnOAI" onclick="setProv('openai')">🤖 OpenAI (GPT)</button>
        <button class="prov-btn" id="btnGEM" onclick="setProv('gemini')">✨ Google Gemini</button>
      </div>

      <div class="frow">
        <span class="flabel">API Key</span>
        <div class="key-wrap">
          <input class="finput" type="password" id="apiKey" placeholder="sk-..." oninput="save()">
          <button class="icon-btn" onclick="toggleKeyVis()" title="Show/Hide">👁️</button>
        </div>
      </div>

      <div class="frow">
        <span class="flabel">Model</span>
        <div class="model-wrap">
          <select id="modelSel" onfocus="checkModels()" onchange="save()">
            <option value="">── Click to load models ──</option>
          </select>
          <span class="mstatus" id="mst"></span>
        </div>
      </div>

      <!-- Glossary -->
      <div class="gsec">
        <div class="sec-title">📚 Glossary</div>

        <div class="gblock">
          <label class="glabel">
            🔒 Keep as-is
            <span class="ghint">— one term per line, will not be translated</span>
          </label>
          <textarea class="gtxt" id="gkeepTxt" placeholder="e.g.&#10;ASUS&#10;ROG&#10;ZenFone&#10;BIOS"></textarea>
        </div>

        <div class="gblock">
          <label class="glabel">
            🔄 Mapped translation
            <span class="ghint">— one pair per line, format: <code class="fmt">original | translation</code></span>
          </label>
          <textarea class="gtxt" id="gmapTxt" placeholder="e.g.&#10;主機板 | Motherboard&#10;韌體 | Firmware&#10;顯示卡 | GPU"></textarea>
        </div>

        <div class="grow">
          <button class="btn" onclick="saveGlossary()">💾 Save Glossary</button>
          <span id="gstatus"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Desktop panels -->
  <div class="panels">
    <div class="panel pl">
      <div class="ptitle">🙋 My Language <span class="ctx-badge" id="ctxBadge">Context: 0 turns</span></div>
      <div class="lw" id="lwLeft"></div>
      <textarea class="ti" id="iLeft" placeholder="Enter text to translate…"
        onkeydown="if((event.ctrlKey||event.metaKey)&&event.key==='Enter')doTranslate('left')"></textarea>
      <div class="tact">
        <div class="tact-l">
          <button class="btn-paste" id="pbLeft" onclick="doPaste('iLeft','pbLeft')">📋 Paste</button>
          <button class="btn-ghost" onclick="clearHist()">🗑️ Clear history</button>
          <span class="hint">Ctrl+Enter</span>
        </div>
        <button class="btn" id="bLeft" onclick="doTranslate('left')">Translate →</button>
      </div>
      <div class="histbox" id="hLeft"></div>
    </div>

    <div class="panel pr">
      <div class="ptitle">👥 Their Language</div>
      <div class="lw" id="lwRight"></div>
      <textarea class="ti" id="iRight" placeholder="Enter text to translate…"
        onkeydown="if((event.ctrlKey||event.metaKey)&&event.key==='Enter')doTranslate('right')"></textarea>
      <div class="tact">
        <div class="tact-l">
          <button class="btn-paste" id="pbRight" onclick="doPaste('iRight','pbRight')">📋 Paste</button>
          <span class="hint">Ctrl+Enter</span>
        </div>
        <button class="btn" id="bRight" onclick="doTranslate('right')">Translate →</button>
      </div>
      <div class="histbox" id="hRight"></div>
    </div>
  </div>

  <!-- Mobile tabs -->
  <div class="mtabs">
    <div class="tabnav">
      <button class="tabbtn on" id="tbLeft"  onclick="switchTab('left')">🙋 My Language</button>
      <button class="tabbtn"    id="tbRight" onclick="switchTab('right')">👥 Their Language</button>
    </div>
    <div class="tabcnt on" id="tcLeft">
      <div class="lw" id="lwML"></div>
      <textarea class="ti" id="iML" placeholder="Enter text to translate…"></textarea>
      <div class="tact">
        <div class="tact-l">
          <button class="btn-paste" id="pbML" onclick="doPaste('iML','pbML')">📋 Paste</button>
          <button class="btn-ghost" onclick="clearHist()">🗑️ Clear</button>
        </div>
        <button class="btn" id="bML" onclick="doTranslate('mLeft')">Translate →</button>
      </div>
      <div class="histbox" id="hML"></div>
    </div>
    <div class="tabcnt" id="tcRight">
      <div class="lw" id="lwMR"></div>
      <textarea class="ti" id="iMR" placeholder="Enter text to translate…"></textarea>
      <div class="tact">
        <div class="tact-l">
          <button class="btn-paste" id="pbMR" onclick="doPaste('iMR','pbMR')">📋 Paste</button>
        </div>
        <button class="btn" id="bMR" onclick="doTranslate('mRight')">Translate →</button>
      </div>
      <div class="histbox" id="hMR"></div>
    </div>
  </div>

</div><!-- /wrap -->

<script>
// ── Languages ──────────────────────────────────────────────
const LANGS = [
  {c:'zh-TW',n:'Chinese (Traditional)'},
  {c:'zh-CN',n:'Chinese (Simplified)'},
  {c:'en',   n:'English'},
  {c:'ja',   n:'Japanese'},
  {c:'ko',   n:'Korean'},
  {c:'th',   n:'Thai'},
  {c:'vi',   n:'Vietnamese'},
  {c:'id',   n:'Indonesian'},
  {c:'ms',   n:'Malay'},
  {c:'fil',  n:'Filipino'},
  {c:'de',   n:'German'},
  {c:'fr',   n:'French'},
  {c:'es',   n:'Spanish'},
  {c:'pt',   n:'Portuguese'},
  {c:'it',   n:'Italian'},
  {c:'nl',   n:'Dutch'},
  {c:'pl',   n:'Polish'},
  {c:'ru',   n:'Russian'},
  {c:'uk',   n:'Ukrainian'},
  {c:'ar',   n:'Arabic'},
  {c:'hi',   n:'Hindi'},
  {c:'tr',   n:'Turkish'},
  {c:'sv',   n:'Swedish'},
  {c:'da',   n:'Danish'},
  {c:'fi',   n:'Finnish'},
  {c:'nb',   n:'Norwegian'},
  {c:'cs',   n:'Czech'},
  {c:'ro',   n:'Romanian'},
  {c:'hu',   n:'Hungarian'},
  {c:'el',   n:'Greek'},
];

// ── State ─────────────────────────────────────────────────
let cfg = {provider:'openai',apiKey:'',model:'',langLeft:'zh-TW',langRight:'en',glossary:[]};
let convHistory = [];
let nextId = 1;
let mCache = {openai:{list:[],ts:0},gemini:{list:[],ts:0}};
let fetching = false;
const TTL = 60000;
const MAX_CTX = 8;

const SMAP = {
  left:  {i:'iLeft', h:'hLeft', b:'bLeft',  sk:'langLeft',  tk:'langRight'},
  right: {i:'iRight',h:'hRight',b:'bRight', sk:'langRight', tk:'langLeft'},
  mLeft: {i:'iML',   h:'hML',   b:'bML',    sk:'langLeft',  tk:'langRight'},
  mRight:{i:'iMR',   h:'hMR',   b:'bMR',    sk:'langRight', tk:'langLeft'},
};

// ── Init ──────────────────────────────────────────────────
function init() {
  try {
    loadCfg();
    buildAllLang();
    loadGlossaryToTextareas();
    updateProvUI();
    updateCtxBadge();
    if (!cfg.apiKey) toggleAc('settings');
  } catch(e) {
    console.error('Init error:', e);
    toast('Initialization error: ' + e.message, 'err');
  }
}

// ── Persist ───────────────────────────────────────────────
function loadCfg() {
  try { const s=localStorage.getItem('ait-cfg'); if(s) Object.assign(cfg,JSON.parse(s)); } catch(e){}
  try { const m=localStorage.getItem('ait-mc');  if(m) Object.assign(mCache,JSON.parse(m)); } catch(e){}
  document.getElementById('apiKey').value = cfg.apiKey || '';
}

function save() {
  cfg.apiKey = document.getElementById('apiKey').value;
  cfg.model  = document.getElementById('modelSel').value;
  localStorage.setItem('ait-cfg', JSON.stringify(cfg));
  const el = document.getElementById('saved');
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('on'), 1800);
}

// ── Provider / Model ──────────────────────────────────────
function setProv(p) {
  cfg.provider = p;
  updateProvUI();
  const sel = document.getElementById('modelSel');
  sel.innerHTML = '<option value="">── Click to load models ──</option>';
  document.getElementById('mst').textContent = '';
  cfg.model = '';
  save();
}

function updateProvUI() {
  document.getElementById('btnOAI').classList.toggle('on', cfg.provider==='openai');
  document.getElementById('btnGEM').classList.toggle('on', cfg.provider==='gemini');
  document.getElementById('apiKey').placeholder = cfg.provider==='openai' ? 'sk-...' : 'AIza...';
}

function toggleKeyVis() {
  const i = document.getElementById('apiKey');
  i.type = i.type==='password' ? 'text' : 'password';
}

function toggleAc(id) {
  const cap = id[0].toUpperCase()+id.slice(1);
  const body  = document.getElementById('body'+cap);
  const arrow = document.getElementById('arr'+cap);
  if (!body) return;
  const open = body.classList.toggle('open');
  if (arrow) arrow.classList.toggle('open', open);
}

async function checkModels() {
  const now = Date.now();
  const c = mCache[cfg.provider];
  if (c.list.length && (now-c.ts)<TTL) { fillModels(c.list); return; }
  if (fetching) return;
  const key = document.getElementById('apiKey').value.trim();
  if (!key) { document.getElementById('mst').textContent='⚠️ Fill in Key first'; return; }
  fetching = true;
  document.getElementById('mst').textContent = '⏳ Loading…';
  try {
    const list = cfg.provider==='openai' ? await fetchOAI_models(key) : await fetchGEM_models(key);
    mCache[cfg.provider] = {list, ts:Date.now()};
    localStorage.setItem('ait-mc', JSON.stringify(mCache));
    fillModels(list);
    document.getElementById('mst').textContent = `✓ ${list.length} models`;
  } catch(e) {
    document.getElementById('mst').textContent = '❌ Failed';
    toast('Failed to load models: '+e.message, 'err');
  } finally { fetching=false; }
}

async function fetchOAI_models(key) {
  const r = await fetch('https://api.openai.com/v1/models',
    {headers:{Authorization:'Bearer '+key}});
  if (!r.ok) { const d=await r.json().catch(()=>({})); throw new Error(d.error?.message||'HTTP '+r.status); }
  const d = await r.json();
  return d.data.map(m=>m.id).filter(id=>{
    const l=id.toLowerCase();
    return !l.includes('embedding')&&!l.includes('whisper')&&
           !l.startsWith('tts')&&!l.startsWith('dall-e')&&
           !l.includes(':')&&!l.startsWith('ft:')&&
           !l.includes('realtime')&&!l.includes('-instruct')&&
           !l.includes('text-davinci')&&!l.includes('text-ada')&&
           !l.includes('text-babbage')&&!l.includes('text-curie');
  }).sort((a,b)=>{
    const r=x=>x.startsWith('gpt-4')?0:x.startsWith('o')?1:x.startsWith('gpt-3')?2:x.startsWith('chatgpt')?3:9;
    return r(a)-r(b)||a.localeCompare(b);
  });
}

async function fetchGEM_models(key) {
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
  if (!r.ok) { const d=await r.json().catch(()=>({})); throw new Error(d.error?.message||'HTTP '+r.status); }
  const d = await r.json();
  return (d.models||[])
    .filter(m=>m.supportedGenerationMethods?.includes('generateContent'))
    .map(m=>m.name.replace('models/',''))
    .sort((a,b)=>{
      const r=x=>x.includes('2.5')?0:x.includes('2.0')?1:x.includes('1.5')?2:x.includes('1.0')?3:9;
      return r(a)-r(b)||a.localeCompare(b);
    });
}

function fillModels(list) {
  const sel = document.getElementById('modelSel');
  const cur = sel.value || cfg.model;
  sel.innerHTML = '<option value="">── Select a model ──</option>';
  list.forEach(m => {
    const o = document.createElement('option');
    o.value = o.textContent = m;
    sel.appendChild(o);
  });
  if (cur && list.includes(cur)) sel.value = cur;
}

// ── Paste ─────────────────────────────────────────────────
async function doPaste(tid, bid) {
  const ta  = document.getElementById(tid);
  const btn = document.getElementById(bid);
  try {
    const text = await navigator.clipboard.readText();
    ta.value = text;
    ta.focus();
    btn.textContent = '✓ Pasted';
    btn.classList.add('pasted');
    setTimeout(()=>{ btn.textContent='📋 Paste'; btn.classList.remove('pasted'); }, 1800);
  } catch(e) {
    // Clipboard API blocked (file:// or no permission) — focus textarea so user can Ctrl+V manually
    ta.focus();
    toast('Clipboard access denied.\nPlease use Ctrl+V to paste manually.', 'inf', 3000);
  }
}

// ── Glossary ──────────────────────────────────────────────
function loadGlossaryToTextareas() {
  const keeps = cfg.glossary.filter(e=>e.type==='keep').map(e=>e.term).join('\n');
  const maps  = cfg.glossary.filter(e=>e.type==='map').map(e=>`${e.term} | ${e.trans}`).join('\n');
  document.getElementById('gkeepTxt').value = keeps;
  document.getElementById('gmapTxt').value  = maps;
}

function saveGlossary() {
  const keepLines = document.getElementById('gkeepTxt').value
    .split('\n').map(s=>s.trim()).filter(Boolean);

  const mapRaw = document.getElementById('gmapTxt').value
    .split('\n').map(s=>s.trim()).filter(Boolean);

  const errors = [];
  const mapEntries = [];
  mapRaw.forEach((line, i) => {
    if (!line.includes('|')) { errors.push(`Line ${i+1} missing "|": "${line}"`); return; }
    const idx = line.indexOf('|');
    const term  = line.slice(0, idx).trim();
    const trans = line.slice(idx+1).trim();
    if (!term)  { errors.push(`Line ${i+1}: original term is empty`); return; }
    if (!trans) { errors.push(`Line ${i+1}: translation is empty`);  return; }
    mapEntries.push({type:'map', term, trans});
  });

  if (errors.length) {
    toast('⚠️ Format error:\n' + errors.slice(0,3).join('\n'), 'err', 4000);
    return;
  }

  cfg.glossary = [
    ...keepLines.map(term=>({type:'keep',term,trans:''})),
    ...mapEntries,
  ];
  save();
  const el = document.getElementById('gstatus');
  el.textContent = `✓ Saved ${cfg.glossary.length} terms`;
  el.style.color = '#34d399';
  setTimeout(()=>{ el.textContent=''; el.style.color=''; }, 2500);
}

function glossaryNote() {
  if (!cfg.glossary.length) return '';
  const keeps = cfg.glossary.filter(e=>e.type==='keep').map(e=>e.term);
  const maps  = cfg.glossary.filter(e=>e.type==='map');
  const pts = [];
  if (keeps.length) pts.push(`Keep these terms untranslated (use as-is): ${keeps.join(', ')}`);
  if (maps.length)  pts.push(`Use these specific translations: ${maps.map(e=>`"${e.term}"→"${e.trans}"`).join(', ')}`);
  return pts.join('; ') + '.';
}

// ── Language selector ─────────────────────────────────────
function buildLang(cid, key, def) {
  const c = document.getElementById(cid); if (!c) return;
  const code = cfg[key] || def;
  const item = LANGS.find(l=>l.c===code) || LANGS[0];
  c.innerHTML = `
    <div class="ldisplay" onclick="openLD('${cid}')">
      <span id="ld_${cid}">${item.n}</span><span class="larr">▼</span>
    </div>
    <div class="ldd" id="ldd_${cid}">
      <input class="lsearch" type="text" placeholder="🔍 Search language…"
             oninput="filterLD('${cid}',this.value)" onclick="event.stopPropagation()">
      <div class="lopts" id="lo_${cid}">
        ${LANGS.map(l=>`
          <div class="lopt ${l.c===code?'sel':''}"
               data-c="${l.c}" data-n="${l.n.replace(/"/g,'&quot;')}"
               data-cid="${cid}" data-key="${key}"
               onclick="pickL(this)">${l.n}</div>`).join('')}
      </div>
    </div>`;
}

function openLD(cid) {
  const dd = document.getElementById('ldd_'+cid);
  const wasOpen = dd.classList.contains('open');
  document.querySelectorAll('.ldd.open').forEach(d=>d.classList.remove('open'));
  if (!wasOpen) {
    dd.classList.add('open');
    setTimeout(()=>{ const i=dd.querySelector('.lsearch'); if(i){i.value='';filterLD(cid,'');i.focus();} },20);
  }
}

function filterLD(cid, q) {
  const lq = q.toLowerCase();
  document.querySelectorAll(`#lo_${cid} .lopt`).forEach(o=>{
    o.style.display = o.textContent.toLowerCase().includes(lq) ? '' : 'none';
  });
}

function pickL(el) {
  const cid=el.dataset.cid, key=el.dataset.key, c=el.dataset.c, n=el.dataset.n;
  cfg[key] = c;
  document.getElementById('ld_'+cid).textContent = n;
  document.getElementById('ldd_'+cid).classList.remove('open');
  document.querySelectorAll(`#lo_${cid} .lopt`).forEach(o=>o.classList.toggle('sel',o.dataset.c===c));
  save();
}

function buildAllLang() {
  buildLang('lwLeft','langLeft','zh-TW');
  buildLang('lwRight','langRight','en');
  buildLang('lwML','langLeft','zh-TW');
  buildLang('lwMR','langRight','en');
}

document.addEventListener('click', e=>{
  if (!e.target.closest('.lw')) document.querySelectorAll('.ldd.open').forEach(d=>d.classList.remove('open'));
});

// ── Translate ─────────────────────────────────────────────
async function doTranslate(side) {
  try {
    const m = SMAP[side]; if (!m) return;
    const text = document.getElementById(m.i).value.trim();
    if (!text) { toast('Please enter text to translate.', 'inf'); return; }

    const key   = document.getElementById('apiKey').value.trim();
    const model = document.getElementById('modelSel').value;
    if (!key)   { toast('Please enter your API Key in Settings.', 'err'); toggleAc('settings'); return; }
    if (!model) { toast('Please select a Model in Settings (click the dropdown to load).', 'err'); toggleAc('settings'); return; }

    const srcC = cfg[m.sk]||'zh-TW', tgtC=cfg[m.tk]||'en';
    const srcN = LANGS.find(l=>l.c===srcC)?.n||srcC;
    const tgtN = LANGS.find(l=>l.c===tgtC)?.n||tgtC;

    const btn = document.getElementById(m.b);
    btn.disabled = true;
    btn.innerHTML = '<span class="sp"></span> Translating…';

    const id = nextId++;
    appendHistEntry(m.h, id, srcN, tgtN, text);

    let result;
    try {
      result = cfg.provider==='openai'
        ? await callOAI(key, model, text, srcN, tgtN)
        : await callGEM(key, model, text, srcN, tgtN);
    } catch(apiErr) {
      updateHistEntryErr(id);
      toast('API error: ' + apiErr.message, 'err', 5000);
      btn.disabled=false; btn.innerHTML='Translate →'; return;
    }

    updateHistEntry(id, result);
    convHistory.push({id, side, srcLang:srcC, tgtLang:tgtC, srcName:srcN, tgtName:tgtN, original:text, translated:result});
    document.getElementById(m.i).value = '';
    updateCtxBadge();
    btn.disabled=false; btn.innerHTML='Translate →';

  } catch(e) {
    console.error('doTranslate() error:', e);
    toast('Unexpected error: '+e.message, 'err');
    ['bLeft','bRight','bML','bMR'].forEach(id=>{
      const b=document.getElementById(id);
      if(b){b.disabled=false;b.innerHTML='Translate →';}
    });
  }
}

// ── History DOM ───────────────────────────────────────────
function appendHistEntry(hid, id, srcN, tgtN, original) {
  const box = document.getElementById(hid); if (!box) return;
  const div = document.createElement('div');
  div.className = 'hentry';
  div.id = 'he_'+id;
  div.innerHTML = `
    <div class="hentry-orig">
      <span class="orig-label">${esc(srcN)} → ${esc(tgtN)}</span>${esc(original)}
    </div>
    <div class="hentry-trans" id="ht_${id}">
      <span class="trans-label">Translation</span>
      <span style="color:var(--muted);font-style:italic;font-size:.85rem">⏳ Translating…</span>
    </div>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function updateHistEntry(id, translated) {
  const t = document.getElementById('ht_'+id); if (!t) return;
  t.innerHTML = `<span class="trans-label">Translation</span>
    <button class="cpbtn" onclick="cpEntry(${id},this)">Copy</button>
    <span class="ttext">${esc(translated)}</span>`;
  const p = t.closest('.histbox');
  if (p) p.scrollTop = p.scrollHeight;
}

function updateHistEntryErr(id) {
  const t = document.getElementById('ht_'+id); if (!t) return;
  t.innerHTML = '<span style="color:#f87171;font-size:.85rem">❌ Translation failed</span>';
}

function cpEntry(id, btn) {
  const ttext = document.querySelector('#ht_'+id+' .ttext');
  const text = ttext?.textContent || convHistory.find(e=>e.id===id)?.translated || '';
  if (!text) return;
  const done = () => {
    btn.textContent='✓ Copied'; btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent='Copy'; btn.classList.remove('copied'); },2000);
  };
  navigator.clipboard?.writeText(text).then(done).catch(()=>{
    const ta=Object.assign(document.createElement('textarea'),{value:text});
    Object.assign(ta.style,{position:'fixed',opacity:'0'});
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    done();
  });
}

function clearHist() {
  convHistory = [];
  ['hLeft','hRight','hML','hMR'].forEach(id=>{
    const b=document.getElementById(id); if(b) b.innerHTML='';
  });
  updateCtxBadge();
  toast('Conversation history cleared.', 'inf', 2000);
}

function updateCtxBadge() {
  const el = document.getElementById('ctxBadge');
  if (el) el.textContent = `Context: ${convHistory.length} turn${convHistory.length!==1?'s':''}`;
}

// ── AI calls ─────────────────────────────────────────────
function buildSysPrompt() {
  const g = glossaryNote();
  return `You are a professional translator. Translate accurately and naturally, taking full account of the conversation context to ensure consistent terminology, appropriate register, and coherent meaning across turns. Output only the translated text — no explanations, labels, or prefixes.${g ? '\nGlossary rules: '+g : ''}`;
}

async function callOAI(key, model, text, srcN, tgtN) {
  const messages = [{role:'system', content:buildSysPrompt()}];
  convHistory.slice(-MAX_CTX).forEach(h=>{
    messages.push({role:'user',      content:`Translate from ${h.srcName} to ${h.tgtName}:\n\n${h.original}`});
    messages.push({role:'assistant', content: h.translated});
  });
  messages.push({role:'user', content:`Translate from ${srcN} to ${tgtN}:\n\n${text}`});

  const r = await fetch('https://api.openai.com/v1/chat/completions',{
    method:'POST',
    headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},
    body:JSON.stringify({model, messages, temperature:0.3})
  });
  if (!r.ok) { const d=await r.json().catch(()=>({})); throw new Error(d.error?.message||'HTTP '+r.status); }
  const d = await r.json();
  return d.choices[0].message.content.trim();
}

async function callGEM(key, model, text, srcN, tgtN) {
  const contents = [];
  convHistory.slice(-MAX_CTX).forEach(h=>{
    contents.push({role:'user',  parts:[{text:`Translate from ${h.srcName} to ${h.tgtName}:\n\n${h.original}`}]});
    contents.push({role:'model', parts:[{text: h.translated}]});
  });
  contents.push({role:'user', parts:[{text:`Translate from ${srcN} to ${tgtN}:\n\n${text}`}]});

  const r = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      contents,
      systemInstruction:{parts:[{text:buildSysPrompt()}]},
      generationConfig:{temperature:0.3}
    })
  });
  if (!r.ok) { const d=await r.json().catch(()=>({})); throw new Error(d.error?.message||'HTTP '+r.status); }
  const d = await r.json();
  return d.candidates[0].content.parts[0].text.trim();
}

// ── Mobile tabs ───────────────────────────────────────────
function switchTab(side) {
  ['Left','Right'].forEach(s=>{
    const lo=s.toLowerCase();
    document.getElementById('tc'+s).classList.toggle('on',lo===side);
    document.getElementById('tb'+s).classList.toggle('on',lo===side);
  });
}

// ── Helpers ───────────────────────────────────────────────
function toast(msg, type='inf', dur=3000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast ${type} on`;
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('on'), dur);
}

function esc(t) {
  return String(t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Start ─────────────────────────────────────────────────
init();
</script>
